name: tests

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinicdesk
          POSTGRES_USER: clinicdesk
          POSTGRES_PASSWORD: clinicdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicdesk -d clinicdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinicdesk:clinicdesk@localhost:5432/clinicdesk
      SECRET_KEY: ci-secret
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=. alembic upgrade head
        working-directory: backend
      - run: PYTHONPATH=. python scripts/seed.py
        working-directory: backend
      - run: PYTHONPATH=. pytest -m integration
        working-directory: backend
