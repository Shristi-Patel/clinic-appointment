services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicdesk
      POSTGRES_USER: clinicdesk
      POSTGRES_PASSWORD: clinicdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicdesk -d clinicdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
